[build]
  command = "npm install && npm install jspdf html2canvas terser --save && npm run build"
  publish = "dist"
  
[build.environment]
  NODE_VERSION = "18"
  # API URL will be set in Netlify dashboard environment variables
  # VITE_API_URL = "https://drag-folio-five.vercel.app"

[[context.production.environment]]
  # This is a placeholder - set VITE_API_URL in Netlify dashboard
  # Go to: Site settings → Environment variables
  # Add: VITE_API_URL = https://drag-folio-five.vercel.app

# Handle SPA routing by redirecting all requests to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Set up headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
