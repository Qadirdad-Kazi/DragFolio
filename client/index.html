<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Favicon and Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#667eea" />
    <meta name="theme-color" content="#667eea" />
    <meta name="msapplication-TileColor" content="#667eea" />
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="description" content="DragFolio - Create and manage your professional portfolio with drag and drop ease" />
    
    <!-- Additional SEO and App Meta Tags -->
    <meta name="author" content="DragFolio" />
    <meta name="application-name" content="DragFolio" />
    <meta name="apple-mobile-web-app-title" content="DragFolio" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https: blob: https://via.placeholder.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://replit.com; connect-src 'self' https: http://localhost:* ws://localhost:*; font-src 'self' https:;">
    
    <!-- Performance optimizations -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="/logo.svg" as="image" type="image/svg+xml" />
    
    <!-- Critical CSS inline (will be filled by build process) -->
    <style id="critical-css"></style>
    
    <!-- Prevent flash of unstyled content -->
    <script>
      // Check for dark mode preference
      const darkModePreference = localStorage.getItem('theme-mode') === 'dark' || 
        (localStorage.getItem('theme-mode') === null && 
         window.matchMedia('(prefers-color-scheme: dark)').matches);
      
      // Apply dark mode class immediately if needed
      if (darkModePreference) {
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
